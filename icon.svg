<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- TÅo ikony - ciemne grafitowe tÅo PWA (Squircle) -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1c222e"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </radialGradient>

    <!-- Metaliczny chromowany maszt -->
    <linearGradient id="poleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#94a3b8"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Metaliczna kula na szczycie masztu -->
    <radialGradient id="knobGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>

    <!-- CieÅ rzucany pod maszt i flagÄ -->
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <!-- WzÃ³r czarnego pola szachownicy -->

    <!-- Klip: flaga i maszt nie wychodzÄ poza zaokrÄglone tÅo (squircle) -->
    <clipPath id="squircleClip">
      <rect width="512" height="512" rx="112"/>
    </clipPath>

    <!-- PoÅysk na powierzchni materiaÅu -->
    <linearGradient id="flagGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- TÅo ikony (Standard App Icon / Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="8"/>

  <!-- Grupa z cieniem, przyciÄta do squircle â flaga siÄga prawie krawÄdzi -->
  <g filter="url(#dropShadow)" clip-path="url(#squircleClip)">

    <!-- PROSTOKÄTNA FLAGA W SZACHOWNICÄ â zajmuje niemal caÅÄ szerokoÅÄ i wysokoÅÄ ikony -->
    <!-- Delikatny poÅysk na powierzchni materiaÅu -->
    <!-- Baza flagi: biale tlo -->
    <rect x="56" y="71" width="444" height="369" fill="#ffffff"/>
    <!-- Trzy wiersze naprzemiennych pol: 6 kolumn (szer. 74), wiersze wys. 123 -->
    <rect x="130" y="71" width="74" height="123" fill="#0f172a"/><rect x="278" y="71" width="74" height="123" fill="#0f172a"/><rect x="426" y="71" width="74" height="123" fill="#0f172a"/>
    <rect x="56" y="194" width="74" height="123" fill="#0f172a"/><rect x="204" y="194" width="74" height="123" fill="#0f172a"/><rect x="352" y="194" width="74" height="123" fill="#0f172a"/>
    <rect x="130" y="317" width="74" height="123" fill="#0f172a"/><rect x="278" y="317" width="74" height="123" fill="#0f172a"/><rect x="426" y="317" width="74" height="123" fill="#0f172a"/>
    <!-- Obramowanie flagi -->
    <rect x="56" y="71" width="444" height="369" fill="none" stroke="#0f172a" stroke-width="3"/>
    <!-- Delikatny polysk na powierzchni materialu -->
    <rect x="56" y="71" width="444" height="369" fill="url(#flagGlint)"/>

    <!-- PROSTY METALICZNY MASZT -->
    <rect x="34" y="56" width="22" height="440" rx="11" fill="url(#poleGrad)"/>
    <circle cx="45" cy="50" r="20" fill="url(#knobGrad)"/>

  </g>
</svg>